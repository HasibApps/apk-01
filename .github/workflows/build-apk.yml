name: Build APK

on:
  push:
    branches:
      - main
      - master
      - "arena/**"
  workflow_dispatch:   # Actions ট্যাব থেকে "Run workflow" চাপলেও বিল্ড হবে

permissions:
  contents: write      # Release তৈরি ও APK আপলোডের জন্য

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  APK_NAME: Study-Tracker-v1.0.0-arm64-v8a.apk
  RELEASE_TAG: v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Restore debug.keystore
        run: |
          if [ -f keystore/debug.keystore.b64 ]; then
            base64 -d keystore/debug.keystore.b64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore debug.keystore -storepass android | tail -3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # Gradle এর আসল এরর GitHub log এ দেখা যায় না বলে
      # ফেইল করলে এরর লাইনগুলো check-run annotation হিসেবে দেখানো হয়।
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --warning-mode=summary 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "### ❌ Build failed" >> "$GITHUB_STEP_SUMMARY"
            grep -nE "e: |error:|FAILURE:|What went wrong|Caused by|Could not (resolve|find|GET|download)|Unresolved reference|> Task .* FAILED" build.log \
              | tail -40 >> "$GITHUB_STEP_SUMMARY" || true
          fi
          exit "$status"

      - name: Report build errors as annotations
        if: failure()
        run: |
          {
            echo "## ❌ Gradle build failed"
            echo '```'
            grep -nE "e: |error:|FAILURE:|What went wrong|Caused by|Could not (resolve|find|GET|download)|Unresolved reference|> Task .* FAILED|A problem occurred" build.log 2>/dev/null | tail -60
            echo '```'
          } > errors.md
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          p = "errors.md"
          if os.path.exists(p):
              print(open(p, encoding="utf-8", errors="replace").read()[:60000])
          PY
          echo "::error title=Gradle build failed::$(grep -E 'e: |error:|What went wrong|Caused by|Could not resolve|Unresolved reference' build.log 2>/dev/null | tail -5 | tr '\n' '|' | cut -c1-800)"

      - name: Collect APK
        if: success()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/$APK_NAME"
          ls -lh out
          sha256sum "out/$APK_NAME" | tee out/sha256.txt

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StudyTracker-debug-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Study Tracker v1.0.0 (arm64-v8a)
          body: |
            **Study Tracker** — HSC Study Reminder & Lecture Tracker with in-app YouTube player + yt-dlp downloader.

            | | |
            |---|---|
            | Version | 1.0 (versionCode 1) |
            | ABI | arm64-v8a |
            | Min Android | 7.0 (API 24) |
            | Target / Compile SDK | 36 |
            | Signing | debug keystore (sideload only) |
            | Commit | `${{ github.sha }}` |
            | Build | #${{ github.run_number }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |

            ### ইনস্টল করার নিয়ম
            1. নিচের `.apk` ফাইলটি ডাউনলোড করুন।
            2. ফোনে "Unknown sources / Install unknown apps" অনুমতি দিন।
            3. APK খুলে Install চাপুন। (Play Store-এ প্রকাশের জন্য নয় — এটি debug-signed)
          files: out/*.apk
          fail_on_unmatched_files: true
          make_latest: true
          draft: false
          prerelease: false

      - name: Summary
        if: success()
        run: |
          {
            echo "### ✅ APK তৈরি হয়েছে"
            echo ""
            echo '```'
            sha256sum "out/$APK_NAME"
            ls -lh "out/$APK_NAME"
            echo '```'
            echo ""
            echo "**রিলিজ লিংক:** ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}"
          } >> "$GITHUB_STEP_SUMMARY"
